name: WCAG Audit | DEV

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  actions: read

concurrency:
  group: wcag-audit-dev
  cancel-in-progress: true

jobs:
  wcag-audit:
    name: Generate WCAG audit artifacts
    runs-on: [ubuntu-latest]
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WCAG_VIEWER_OPEN: "false"
      WCAG_PLAYWRIGHT_ENABLED: "true"
      WCAG_PLAYWRIGHT_FORCE_MOCK_AUTH: "true"
      WCAG_PLAYWRIGHT_AUTOSTART_FRONTEND: "true"
      WCAG_PLAYWRIGHT_AUTOSTART_BACKEND: "true"
      WCAG_PLAYWRIGHT_PREPARE_DEV_ENV: "true"
      WCAG_PLAYWRIGHT_SEED_BACKEND: "false"
      WCAG_PLAYWRIGHT_BASE_URL: "http://localhost:5173"
      WCAG_PLAYWRIGHT_BACKEND_BASE_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Reset git state
        run: git reset --hard

      - name: Clean workspace
        run: git clean -fdx

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' build

      - name: Install Playwright Chromium
        run: pnpm --filter wcag-compliance-viewer playwright:install

      - name: Run WCAG check
        run: pnpm wcag:check

      - name: Generate filtered WCAG assessments
        run: |
          pnpm --filter wcag-compliance-viewer filter-assessment -- status=needs-verification
          pnpm --filter wcag-compliance-viewer filter-assessment -- status=partially-supports
          pnpm --filter wcag-compliance-viewer filter-assessment -- status=does-not-support

      - name: Build offline WCAG viewer
        run: pnpm --filter wcag-compliance-viewer build

      - name: Package WCAG audit artifact
        if: always()
        run: |
          rm -rf wcag-audit-artifact
          mkdir -p wcag-audit-artifact

          cat > wcag-audit-artifact/README.txt <<'EOF'
          WCAG audit artifact

          Open wcag-compliance-viewer.html in a browser to review the interactive report offline.
          The markdown reports and JSON assessment files are included in this same folder.
          EOF

          cp -f docs/wcag-a-aa-conformance-assessment.md wcag-audit-artifact/wcag-a-aa-conformance-assessment.md 2>/dev/null || true
          cp -f docs/wcag-tester-coverage-review.md wcag-audit-artifact/wcag-tester-coverage-review.md 2>/dev/null || true
          cp -f docs/wcag-token-usage.md wcag-audit-artifact/wcag-token-usage.md 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagAssessment.json wcag-audit-artifact/wcagAssessment.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagAssessment.filtered-needs-verification.json wcag-audit-artifact/wcagAssessment.filtered-needs-verification.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagAssessment.filtered-partially-supports.json wcag-audit-artifact/wcagAssessment.filtered-partially-supports.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagAssessment.filtered-does-not-support.json wcag-audit-artifact/wcagAssessment.filtered-does-not-support.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagRuntimeEvidence.json wcag-audit-artifact/wcagRuntimeEvidence.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagTesterCoverageReview.json wcag-audit-artifact/wcagTesterCoverageReview.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/src/generated/wcagTokenUsage.json wcag-audit-artifact/wcagTokenUsage.json 2>/dev/null || true
          cp -f apps/wcag-compliance-viewer/dist/wcag-compliance-viewer.html wcag-audit-artifact/wcag-compliance-viewer.html 2>/dev/null || true

          find wcag-audit-artifact -maxdepth 1 -type f -print | sort

      - name: Upload WCAG audit artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wcag-audit-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: wcag-audit-artifact/*

      - name: Clean WCAG dev services
        if: always()
        run: docker compose -f apps/dev-env/docker-compose.yml down -v
