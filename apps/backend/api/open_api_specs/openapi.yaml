          application/json:
            schema:
              $ref: '#/components/schemas/Request'
        required: true
      responses:
        '201':
          description: Request created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Create a new request
  /requests/{id}:
    get:
