  /auth/token:
    post:
      summary: Exchange authorization code for tokens
      description: >
        Exchanges an authorization code for access, refresh, and ID tokens.
        In login-gov mode, a code_verifier is required for PKCE.
        Protected by rate-limiting middleware.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                code_verifier:
                  type: string
                  description: Required for PKCE in login-gov mode
              required:
                - code
      responses:
        "200":
          description: Token exchange response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Missing code or code_verifier
        "403":
          description: User not found in system
        "500":
          description: Failed to exchange authorization code
  /auth/refresh:
    post:
      summary: Refresh JWT token
      description: >
        Rotates refresh tokens and issues a new access token. Protected by rate-limiter.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New JWT and refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Missing or invalid refresh token
        "404":
          description: User not found
        "500":
          description: Failed to refresh token
  /auth/user:
    get:
      summary: Get current user profile
