paths:
  /common-conditions/options:
    get:
      summary: Get published common condition options
      description: Retrieve published common conditions for the approval dropdown.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CommonConditionOptionsItem'
                type: array
          description: List of published common condition options
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/published:
    get:
      summary: Get paginated published common conditions
      description: Retrieve the published common conditions for the admin table.
      parameters:
      - description: Number of results per page
        in: query
        name: pageSize
        required: false
        schema:
          default: 10
          minimum: 1
          type: integer
      - description: Page number to retrieve
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommonConditionsResponse'
          description: Paginated list of published common conditions
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/submitted:
    get:
      summary: Get paginated workflow common conditions
      description: Retrieve draft, submitted, and rejected common conditions for the admin workflow table.
      parameters:
      - description: Number of results per page
        in: query
        name: pageSize
        required: false
        schema:
          default: 10
          minimum: 1
          type: integer
      - description: Page number to retrieve
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Filter workflow common conditions by one or more statuses
        in: query
        name: statuses
        required: false
        schema:
          items:
            $ref: '#/components/schemas/CommonConditionWorkflowStatus'
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommonConditionsResponse'
          description: Paginated list of workflow common conditions
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/drafts:
    post:
      summary: Create a common condition draft
      description: Create a new draft common condition owned by the authenticated author.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonConditionCreateDraft'
        required: true
      responses:
        '201':
          description: Common condition draft created successfully
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/drafts/{id}:
    put:
      summary: Update a draft common condition
      description: Update title and content for a draft common condition owned by the authenticated author.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonConditionCreateDraft'
        required: true
      responses:
        '200':
          description: Common condition draft updated successfully
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - invalid workflow state
        '404':
          description: Common condition not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
    delete:
      summary: Delete a common condition
      description: Delete a common condition when permitted by role and workflow state. Federal users may delete only their own draft conditions, while NTIA may delete only final-stage approved or denied conditions.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Common condition deleted successfully
        '400':
          description: Invalid common condition id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - invalid workflow state
        '404':
          description: Common condition not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/{id}/submit:
    post:
      summary: Submit a common condition draft
      description: Transition a draft common condition to submitted for review.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Common condition draft submitted successfully
        '400':
          description: Invalid common condition id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - invalid workflow state
        '404':
          description: Common condition not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/{id}/publish:
    post:
      summary: Publish a submitted common condition
      description: Transition a submitted common condition to published.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Common condition published successfully
        '400':
          description: Invalid common condition id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - invalid workflow state
        '404':
          description: Common condition not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /common-conditions/{id}/reject:
    post:
      summary: Reject a submitted common condition
      description: Transition a submitted common condition to rejected with a rejection reason.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonConditionReject'
        required: true
      responses:
        '200':
          description: Common condition rejected successfully
        '400':
          description: Invalid request payload
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict - invalid workflow state
        '404':
          description: Common condition not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - CommonConditions
  /dashboard/requests-over-time/{timeframe}:
    get:
      summary: Get request submission metrics over a time period
      description: Retrieve metrics showing the number of requests submitted during a specified timeframe
      parameters:
      - description: Time period to retrieve data for
        in: path
        name: timeframe
        required: true
        schema:
          $ref: '#/components/schemas/Timeframe'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RequestsOverTimeData'
                type: array
          description: List of requests submitted metrics
        '400':
          description: Invalid timeframe parameter
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - Dashboard
  /dashboard/request-completion-time/{timeframe}:
    get:
      summary: Get request completion time metrics over a time period
      description: Retrieve metrics showing the average completion time for requests during a specified timeframe
      parameters:
      - description: Time period to retrieve data for
        in: path
        name: timeframe
        required: true
        schema:
          $ref: '#/components/schemas/Timeframe'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RequestCompletionTimeData'
                type: array
          description: List of request completion time metrics
        '400':
          description: Invalid timeframe parameter
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - Dashboard
  /dashboard/requests-by-commercial-entity:
    get:
      summary: Get request count by commercial entity
      description: Retrieve the count of requests submitted by each commercial entity
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RequestsByCommercialEntityData'
                type: array
          description: List of request counts by commercial entity
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - Dashboard
  /dashboard/requests-by-status:
    get:
      summary: Get request count by status
      description: Retrieve the count of requests grouped by their current status
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RequestsByStatusData'
                type: array
          description: List of request counts by status
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      tags:
      - Dashboard
  /request-drafts:
    get:
      parameters:
      - description: User ID for access control filtering
        in: query
        name: user_id
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserNameHeader'
      - $ref: '#/components/parameters/UserTypeHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RequestDraft'
                type: array
          description: List of request drafts (filtered by entity for COMMERCIAL users)
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      summary: Retrieve all request drafts with entity-based access control
      tags:
      - RequestDraft
    post:
      parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserNameHeader'
      - $ref: '#/components/parameters/UserTypeHeader'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/RequestDraft'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDraft'
          description: Request draft created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      summary: Create a new request draft
      tags:
      - RequestDraft
  /request-drafts/{id}:
    get:
      parameters:
      - description: The ID of the request draft to retrieve
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: User ID for entity-based access control filtering
        in: query
        name: user_id
        required: false
        schema:
          type: string
      - &id001
        $ref: '#/components/parameters/UserIdHeader'
      - &id002
        $ref: '#/components/parameters/UserNameHeader'
      - &id003
        $ref: '#/components/parameters/UserTypeHeader'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDraft'
          description: Request draft found (access controlled by entity for COMMERCIAL users when user_id is provided)
        '401':
          description: Unauthorized
        '404':
          description: Request draft not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      summary: Retrieve a request draft by ID with entity-based access control
      tags:
      - RequestDraft
  /requests:
    get:
      parameters:
      - description: Number of results per page
        in: query
        name: pageSize
        required: false
        schema:
          default: 10
          minimum: 1
          type: integer
      - description: Page number to retrieve
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: read boolean flag
        in: query
        name: unread
        required: false
        schema:
          default: true
          type: boolean
      - description: Filter requests by one or more statuses
        in: query
        name: statuses
        required: false
        schema:
          items:
            $ref: '#/components/schemas/Status'
          type: array
      - description: Search for requests by call_sign or comments
        in: query
        name: search
        required: false
        schema:
          type: string
      - description: Field to sort request results by
        in: query
        name: sortBy
        required: false
        schema:
          enum:
          - createdAt
          - daysToOperation
          - mission_name
          - id
          - launch_datetime_primary
          - name_of_licensee
          - primary_poc_email
          type: string
      - description: Direction to sort request results
        in: query
        name: sortDirection
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: IANA timezone used to resolve relative and date-only filters
        in: query
        name: timezone
        required: false
        schema:
          example: America/New_York
          type: string
      - description: ISO date-time used as the reference instant for days-to-operation filters
        in: query
        name: referenceDate
        required: false
        schema:
          example: '2026-06-10T12:00:00.000Z'
          type: string
      - description: JSON-encoded advanced request table filter rules for status, text, date, number, and exact launch serial number request fields
        in: query
        name: filterRules
        required: false
        schema:
          type: string
      - description: User ID for entity-based filtering. When provided, unreadMessageCount will be included for inquiries where the user's entity is involved (Commercial, Federal Agency, or NTIA).
        in: query
        name: user_id
        required: false
        schema:
          type: string
      - *id001
      - *id002
      - *id003
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestsResponse'
          description: Paginated list of request summaries with entity-based filtering and unread message counts
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Access denied due to entity restrictions
      security:
      - bearerAuth: []
      summary: Retrieve paginated requests with entity-based filtering and unread message counts
    post:
      parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserNameHeader'
      - $ref: '#/components/parameters/UserTypeHeader'
      requestBody:
