      type: http
  responses:
    AccessDenied:
      description: |
        Access denied due to entity-based access control restrictions.
        COMMERCIAL users can only access data related to requests created by their own entity.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Users can only view data created by their own entity"
    EntityFilteredResponse:
      description: |
        Response filtered based on user's entity type:
        - COMMERCIAL users see only data from their own entity
        - NTIA and FEDERAL_AGENCY users see all data
info:
  description: |
    API for managing launch requests and their associated frequencies.

    ## Access Control

    This API implements entity-based access control to ensure data security and proper collaboration:

    ### User Types and Access Levels

    - **COMMERCIAL Users**: Can only view data (requests, actions, approvals, comments, concurrences, denials, requested revisions, and request drafts) related to requests created by users from their own entity/organization. This enables collaboration within the same commercial entity while maintaining data isolation between different organizations.

    - **NTIA Users**: Have full access to view all data across all requests and entities. This allows government oversight and administration of the entire system.

    - **FEDERAL_AGENCY Users**: Have full access to view all data across all requests and entities. This allows federal agencies to maintain oversight across all requests.

    ### Implementation Details

    - Most GET endpoints accept an optional `user_id` query parameter for access control filtering
    - When `user_id` is provided, the system validates the user's entity type and applies appropriate filtering
    - COMMERCIAL users will only see data from requests created by their own entity
    - NTIA and FEDERAL_AGENCY users see all data without restrictions
    - When `user_id` is not provided, no access control filtering is applied (for backward compatibility)

    ### Unread Message Counts

    The `/requests` endpoint includes entity-based unread message counts when the `user_id` parameter is provided:

    - **Entity-Based Filtering**: Users only see unread message counts for inquiries where their entity is involved as either entityA or entityB
    - **Commercial Users**: See unread counts only for inquiries involving their commercial entity
    - **Federal Agency Users**: See unread counts only for inquiries involving their federal agency entity
    - **NTIA Users**: See unread counts only for inquiries involving NTIA
    - **Privacy Protection**: Users cannot see unread message counts for inquiries between other entities
    - **Performance**: Counts are calculated efficiently using database joins with proper entity filtering
    - **Read Status Tracking**: Messages are automatically marked as read when users access inquiry details, updating the unread counts in real-time
    - **Zero Count Handling**: The `unreadMessageCount` property is omitted entirely when the count is 0, reducing payload size and preventing display of zero badges

    ### Affected Endpoints

    The following endpoints implement entity-based access control:
    - `GET /requests` - List requests with entity-based unread message counts
    - `GET /requests/{id}/actions` - List actions for a request
    - `GET /requests/{id}/approvals` - List approvals for a request
    - `GET /requests/{id}/comments` - List comments for a request
    - `GET /requests/{id}/concurrences` - List concurrences for a request
    - `GET /requests/{id}/denials` - List denials for a request
    - `GET /requests/{id}/requested-revisions` - Get requested revisions for a request
    - `GET /request-drafts` - List request drafts
    - `GET /request-drafts/{id}` - Get a specific request draft

    ### Authentication Endpoints

    The `/auth` endpoints provide the complete authentication flow for the application:

    - `POST /auth/token` - Exchanges an authorization code for access, refresh, and ID tokens. Used immediately after login redirect from the provider.
    - `POST /auth/refresh`- Rotates refresh tokens and issues a new access token. Enforces refresh token reuse detection and revocation.
    - `GET /auth/user`- Retrieves the authenticated user's profile, entity permissions, and provider metadata.
    - `**`POST /auth/logout`- Revokes the current refresh token and returns an optional logout redirect URL.
    - `**`GET /auth/config`- Returns authentication configuration for the frontend (mode, enabled providers, redirect URIs).
    - `POST `/auth/debug-user`- Development-only endpoint used to inspect provider-issued claims using an authorization code.
    All authentication endpoints support rate-limiting, token validation, and security auditing.

