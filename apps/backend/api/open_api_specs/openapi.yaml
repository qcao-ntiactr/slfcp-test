components:
  parameters:
    UserIdHeader:
      in: header
      name: user_id
      required: true
      schema:
        type: string
    UserNameHeader:
      in: header
      name: user_name
      required: true
      schema:
        type: string
    UserTypeHeader:
      in: header
      name: user_type
      required: true
      schema:
        $ref: '#/components/schemas/UserType'
  schemas:
    Action:
      properties:
        action:
          $ref: '#/components/schemas/ActionType'
        details:
          nullable: true
          type: string
        createdAt:
          description: Timestamp the action was created (ISO 8601 format with time
            zone)
          format: date-time
          type: string
        federal_agency_abbr:
          nullable: true
          type: string
        federal_agency_id:
          nullable: true
          type: integer
        federal_agency_name:
          nullable: true
          type: string
        id:
          type: integer
        request_id:
          type: integer
        user_id:
          type: string
        user_name:
          type: string
        user_type:
          $ref: '#/components/schemas/UserType'
      required:
      - request_id
      - user_id
      - user_name
      - user_type
      - action
      type: object
    ActionType:
      enum:
      - approve
      - finalize_denial
      - approve_with_conditions
      - concur
      - concur_with_conditions
      - not_concur
      - request_revisions
      - resubmit
      - auto_approve
      type: string
    Approval:
      properties:
        condition:
          type: string
        createdAt:
          description: Timestamp the record was created in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        date_approved:
          description: Date approved in ISO 8601 format with time zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        id:
          type: integer
        is_final:
          type: boolean
        read:
          type: boolean
        request_id:
          type: integer
        user_id:
          type: string
        updatedAt:
          description: Timestamp the record was updates in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
      required:
      - request_id
      - date_approved
      - condition
      type: object
    Comment:
      properties:
        comment:
          type: string
        createdAt:
          description: Timestamp the comment was created (ISO 8601 format with time
            zone)
          format: date-time
          type: string
        federal_agency_abbr:
          type: string
        federal_agency_id:
          nullable: true
          type: integer
        federal_agency_name:
          type: string
        id:
          type: integer
        is_internal:
          type: boolean
        request_id:
          type: integer
        user_id:
          type: string
        user_name:
          type: string
        user_type:
          $ref: '#/components/schemas/UserType'
      required:
      - request_id
      - user_id
      - comment
      type: object
    Concurrence:
      properties:
        concurred:
          type: boolean
        conditions:
          type: string
        createdAt:
          description: Timestamp the record was created in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        entity_abbr:
          nullable: true
          type: string
        entity_id:
          nullable: true
          type: integer
        entity_name:
          nullable: true
          type: string
        id:
          type: integer
        request_id:
          type: integer
        updatedAt:
          description: Timestamp the record was updates in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        user_id:
          type: string
        user_name:
          type: string
        user_type:
          $ref: '#/components/schemas/UserType'
      required:
      - request_id
      - user_id
      - concurred
      type: object
    Denial:
      properties:
        createdAt:
          description: Timestamp the record was created in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        date_denied:
          description: Date denied in ISO 8601 format with time zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        id:
          type: integer
        is_final:
          type: boolean
        read:
          type: boolean
        reason:
          description: Denial Reason.
          type: string
        request_id:
          type: integer
        user_id:
          type: string
        updatedAt:
          description: Timestamp the record was updates in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
      required:
      - request_id
      - date_denied
      - reason
      type: object
    Receiver:
      properties:
        antenna_altitude:
          type: integer
        antenna_altitude_unit:
          enum:
          - ft
          - m
          - km
          type: string
        antenna_beamwidth:
          type: integer
        antenna_gain:
          type: integer
        antenna_type:
          type: string
        latitude_of_receiving_antenna:
          format: decimal
          type: number
        location_of_receiving_ground_station:
          enum:
          - first_stage
          - second_stage
          - ground
          type: string
        longitude_of_receiving_antenna:
          format: decimal
          type: number
        transmission_end:
          format: date-time
          type: string
        transmission_start:
          format: date-time
          type: string
    Frequency:
      properties:
        createdAt:
          description: Timestamp the record was created in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        eirp:
          format: float
          type: number
        eirp_unit:
          enum:
          - Watts
          - dBW
          - milliWatts
          - dBm
          type: string
        frequency:
          format: float
          type: number
        id:
          type: integer
        location_of_transmitter_on_vehicle_or_platform:
          enum:
          - first_stage
          - second_stage
          - ground
          type: string
        minus_20db_bandwidth:
          format: decimal
          maximum: 99.99
          minimum: -99.99
          type: number
        minus_20db_bandwidth_before_or_after_filtering:
          enum:
          - before_filtering
          - after_filtering
          type: string
        minus_3db_bandwidth:
          format: decimal
          maximum: 99.99
          minimum: -99.99
          type: number
        minus_3db_bandwidth_before_or_after_filtering:
          enum:
          - before_filtering
          - after_filtering
          type: string
        minus_60db_bandwidth:
          format: decimal
          maximum: 99.99
          minimum: -99.99
          type: number
        minus_60db_bandwidth_before_or_after_filtering:
          enum:
          - before_filtering
          - after_filtering
          type: string
        nature_of_modulating_signals:
          maxLength: 50
          type: string
        emission_designator:
          maxLength: 50
          type: string
        request_id:
          type: integer
        transmitted_bandwidth:
          format: decimal
          maximum: 99.99
          minimum: -99.99
          type: number
        transmitted_bandwidth_is_signal_filtered:
          enum:
          - filtered
          - not_filtered
          type: string
        transmitted_bandwidth_justification:
          type: string
        tx_antenna_altitude:
          maximum: 99999
          minimum: -300
          type: integer
        tx_antenna_altitude_unit:
          enum:
          - ft
          - m
          - km
          type: string
        tx_antenna_beamwidth:
          maximum: 999
          minimum: 1
          type: integer
        tx_antenna_gain:
          maximum: 99
          minimum: 1
          type: integer
        tx_antenna_type:
          maxLength: 50
          type: string
        tx_transmission_end:
          description: The end time of transmission in ISO 8601 format with time zone
            (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        tx_transmission_start:
          description: The start time of transmission in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        receivers:
          items:
            $ref: '#/components/schemas/Receiver'
          type: array
        updatedAt:
          description: Timestamp the record was updates in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
      required:
      - request_id
      - frequency
      - location_of_transmitter_on_vehicle_or_platform
      - eirp
      - eirp_unit
      - transmitted_bandwidth
      - transmitted_bandwidth_is_signal_filtered
      - transmitted_bandwidth_justification
      - minus_3db_bandwidth
      - minus_3db_bandwidth_before_or_after_filtering
      - minus_20db_bandwidth
      - minus_20db_bandwidth_before_or_after_filtering
      - minus_60db_bandwidth
      - minus_60db_bandwidth_before_or_after_filtering
      - nature_of_modulating_signals
      - emission_designator
      - tx_transmission_start
      - tx_transmission_end
      - tx_antenna_type
      - tx_antenna_gain
      - tx_antenna_beamwidth
      - tx_antenna_altitude
      - tx_antenna_altitude_unit
      - receivers
      type: object
    FrequencyDraft:
      properties:
        createdAt:
          format: date-time
          type: string
        eirp:
          format: float
          type: number
        eirp_unit:
          enum:
          - Watts
          - dBW
          - milliWatts
          - dBm
          type: string
        frequency:
          format: float
          type: number
        id:
          type: integer
        location_of_transmitter_on_vehicle_or_platform:
          enum:
          - first_stage
          - second_stage
          - ground
          type: string
        minus_20db_bandwidth:
          format: decimal
          type: number
        minus_20db_bandwidth_before_or_after_filtering:
          enum:
          - before_filtering
          - after_filtering
          type: string
        minus_3db_bandwidth:
          format: decimal
          type: number
        minus_3db_bandwidth_before_or_after_filtering:
          enum:
          - before_filtering
          - after_filtering
          type: string
        minus_60db_bandwidth:
          format: decimal
          type: number
        minus_60db_bandwidth_before_or_after_filtering:
          enum:
          - before_filtering
          - after_filtering
          type: string
        nature_of_modulating_signals:
          type: string
        emission_designator:
          type: string
        transmitted_bandwidth:
          format: decimal
          type: number
        transmitted_bandwidth_is_signal_filtered:
          enum:
          - filtered
          - not_filtered
          type: string
        transmitted_bandwidth_justification:
          type: string
        tx_antenna_altitude:
          type: integer
        tx_antenna_altitude_unit:
          enum:
          - ft
          - m
          - km
          type: string
        tx_antenna_beamwidth:
          type: integer
        tx_antenna_gain:
          type: integer
        tx_antenna_type:
          type: string
        tx_transmission_end:
          format: date-time
          type: string
        tx_transmission_start:
          format: date-time
          type: string
        receivers:
          items:
            $ref: '#/components/schemas/Receiver'
          type: array
        updatedAt:
          format: date-time
          type: string
      type: object
    Request:
      allOf:
      - $ref: '#/components/schemas/RequestFrequencyBase'
      properties:
        ecf_cartesian_vectors_format_file:
          format: binary
          type: string
        ground_track_of_launch_vehicle_2d_img_file:
          format: binary
          type: string
      required:
      - ecf_cartesian_vectors_format_file
      - ground_track_of_launch_vehicle_2d_img_file
    RequestBase:
      properties:
        alternate_poc_email:
          format: email
          maxLength: 50
          type: string
        alternate_poc_name:
          maxLength: 50
          type: string
        alternate_poc_phone:
          maxLength: 12
          type: string
        call_sign:
          maxLength: 8
          type: string
        city:
          maxLength: 25
          type: string
        createdAt:
          description: Timestamp the record was created in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        current_revision:
          type: boolean
        ecf_cartesian_vectors_format_file_desc:
          type: string
        fcc_filing_date:
          description: This is optionally entered by the user and is stored as an
            ISO date-time Zulu, otherwise defaults to current date-time
          format: date-time
          type: string
        ground_track_from_liftoff_until_payload_separation:
          type: string
        ground_track_of_launch_vehicle_2d_img_file_desc:
          type: string
        id:
          type: integer
        user_id:
          type: string
        latitude:
          format: decimal
          maximum: 90.0
          minimum: -90.0
          type: number
        launch_datetime_backup:
          description: The end time of launch in ISO 8601 format with time zone (e.g.,
            "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        launch_datetime_primary:
          description: The start time of launch in ISO 8601 format with time zone
            (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
        longitude:
          format: decimal
          maximum: 180.0
          minimum: -180.0
          type: number
        mission_name:
          maxLength: 50
          type: string
        name_of_launch_vehicle:
          maxLength: 50
          type: string
        name_of_licensee:
          maxLength: 50
          type: string
        number_of_frequencies:
          maximum: 50
          minimum: 1
          type: integer
        orbital_location:
          type: string
        primary_poc_email:
          format: email
          maxLength: 50
          type: string
        primary_poc_name:
          maxLength: 50
          type: string
        primary_poc_phone:
          maxLength: 12
          type: string
        read:
          type: boolean
        revision:
          type: integer
        root_request_id:
          type: integer
        state:
          maxLength: 2
          type: string
        status:
          $ref: '#/components/schemas/Status'
        updatedAt:
          description: Timestamp the record was updated in ISO 8601 format with time
            zone (e.g., "2024-12-09T15:30:00Z").
          format: date-time
          type: string
      required:
      - user_id
      - mission_name
      - name_of_licensee
      - call_sign
      - name_of_launch_vehicle
      - city
      - state
      - latitude
      - longitude
      - launch_datetime_primary
      - launch_datetime_backup
      - number_of_frequencies
      - ground_track_from_liftoff_until_payload_separation
      - ecf_cartesian_vectors_format_file_desc
      - ground_track_of_launch_vehicle_2d_img_file_desc
      - primary_poc_name
      - primary_poc_email
      - primary_poc_phone
      - alternate_poc_name
      - alternate_poc_email
      - alternate_poc_phone
      - status
      - revision
      type: object
    RequestSummary:
      allOf:
      - $ref: '#/components/schemas/RequestBase'
      properties:
        frequencies:
          description: Array of frequency values for this request
          items:
            type: number
            format: float
          type: array
        unreadMessageCount:
          description: Number of unread messages in inquiries where the user's entity is involved. Only included when user_id parameter is provided, entity-based filtering is applied, and count is greater than 0. Omitted when count is 0 or user's entity is not involved in any inquiries for this request.
          type: integer
          minimum: 1
          example: 3
      required:
      - frequencies
    RequestsResponse:
      properties:
        data:
          description: Array of request summaries with entity-based filtering applied
          items:
            $ref: '#/components/schemas/RequestSummary'
          type: array
        totalCount:
          description: Total number of requests matching the filter criteria
          type: integer
          minimum: 0
          example: 150
        totalPages:
          description: Total number of pages based on pageSize
          type: integer
          minimum: 0
          example: 15
      required:
      - data
      - totalCount
      - totalPages
      type: object
      example:
        data:
          - id: 20
            mission_name: "Launch Request 1"
            name_of_licensee: "Commercial Corp"
            call_sign: "COMM1"
            status: "UNDER_NTIA_INITIAL_REVIEW"
            frequencies: [2400.0, 2450.0]
            unreadMessageCount: 2
          - id: 21
            mission_name: "Launch Request 2"
            name_of_licensee: "NASA Request"
            call_sign: "NASA1"
            status: "UNDER_FEDERAL_AGENCIES_REVIEW"
            frequencies: [2500.0]
            # Note: unreadMessageCount omitted when 0
        totalCount: 150
        totalPages: 15
    RequestDetails:
      allOf:
      - $ref: '#/components/schemas/RequestFrequencyBase'
      properties:
        ecf_cartesian_vectors_format_file:
          description: file content is base64 encoded
          type: string
        ground_track_of_launch_vehicle_2d_img_file:
          description: file content is base64 encoded
          type: string
      required:
      - ecf_cartesian_vectors_format_file
      - ground_track_of_launch_vehicle_2d_img_file
    RequestDraft:
      properties:
        alternate_poc_email:
          type: string
        alternate_poc_name:
          type: string
        alternate_poc_phone:
          type: string
        call_sign:
          type: string
        city:
          type: string
        createdAt:
          format: date-time
          type: string
        ecf_cartesian_vectors_format_file:
          description: file content is base64 encoded
          type: string
        ecf_cartesian_vectors_format_file_desc:
          type: string
        ecf_cartesian_vectors_format_file_path:
          type: string
        fcc_filing_date:
          format: date-time
          type: string
        frequencies:
          items:
            $ref: '#/components/schemas/FrequencyDraft'
          type: array
        ground_track_from_liftoff_until_payload_separation:
          type: string
        ground_track_of_launch_vehicle_2d_img_file:
          description: file content is base64 encoded
          type: string
        ground_track_of_launch_vehicle_2d_img_file_desc:
          type: string
        ground_track_of_launch_vehicle_2d_img_file_path:
          type: string
        id:
          type: integer
        latitude:
          format: decimal
          type: number
        launch_datetime_backup:
          format: date-time
          type: string
        launch_datetime_primary:
          format: date-time
          type: string
        longitude:
          format: decimal
          type: number
        mission_name:
          type: string
        name_of_launch_vehicle:
          type: string
        name_of_licensee:
          type: string
        number_of_frequencies:
          type: integer
        orbital_location:
          type: string
        primary_poc_email:
          type: string
        primary_poc_name:
          type: string
        primary_poc_phone:
          type: string
        state:
          type: string
        updatedAt:
          format: date-time
          type: string
        user_id:
          type: string
      required:
      - user_id
      type: object
    RequestFrequencyBase:
      allOf:
      - $ref: '#/components/schemas/RequestBase'
      properties:
        frequencies:
          items:
            $ref: '#/components/schemas/Frequency'
          type: array
      required:
      - frequencies
    RequestList:
      allOf:
      - $ref: '#/components/schemas/RequestBase'
      properties:
        ecf_cartesian_vectors_format_file:
          description: file content is base64 encoded
          type: string
        frequencies:
          description: Array of frequencies (as floats)
          items:
            format: float
            type: number
          type: array
        ground_track_of_launch_vehicle_2d_img_file:
          description: file content is base64 encoded
          type: string
    RequestedRevision:
      properties:
        createdAt:
          description: Timestamp the revision was created (ISO 8601 format with time
            zone)
          format: date-time
          type: string
        id:
          type: integer
        requested_changes:
          items:
            type: string
          type: array
        updatedAt:
          description: Timestamp the revision was last updated (ISO 8601 format with
            time zone)
          format: date-time
          type: string
        user_id:
          type: string
      required:
      - request_id
      - requested_changes
      - user_id
      type: object

    Message:
      type: object
      required:
        - inquiry_id
        - sender_id
        - content
        - sentAt
      properties:
        id:
          type: integer
        inquiry_id:
          type: integer
        sender_id:
          type: integer
        content:
          type: string
        sentAt:
          type: string
          format: date-time
          description: Timestamp the revision was created (ISO 8601 format with time zone)
    MessageResponse:
      type: object
      required:
        - inquiry_id
        - sender_id
        - content
        - sentAt
      properties:
        id:
          type: integer
        inquiry_id:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        content:
          type: string
        sentAt:
          type: string
          format: date-time
          description: Timestamp the revision was created (ISO 8601 format with time zone)
    Inquiry:
      type: object
      required:
        - request_id
        - entityA_id
        - entityB_id
        - createdAt
        - messages
      properties:
        id:
          type: integer
        request_id:
          type: integer
        entityA_id:
          type: integer
        entityB_id:
          type: integer
        closed:
          type: boolean
        closedBy_id:
          type: integer
        closedAt:
          type: string
          format: date-time
          description: Timestamp the comment was created (ISO 8601 format with time zone)
        createdAt:
          type: string
          format: date-time
          description: Timestamp the comment was created (ISO 8601 format with time zone)
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    InquiryResponse:
      type: object
      required:
        - request_id
        - entityA_id
        - entityB_id
        - createdAt
        - messages
      properties:
        id:
          type: integer
        request_id:
          type: integer
        entityA_id:
          type: integer
        entityB_id:
          type: integer
        closed:
          type: boolean
        closedBy:
          $ref: '#/components/schemas/User'
        closedAt:
          type: string
          format: date-time
          description: Timestamp the comment was created (ISO 8601 format with time zone)
        createdAt:
          type: string
          format: date-time
          description: Timestamp the comment was created (ISO 8601 format with time zone)
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
    User:
      type: object
      required:
        - external_id
        - name
        - email
        - entity_id
        - can_concur
        - messages
        - closedInquiries
      properties:
        id:
          type: integer
        external_id:
          type: string
        name:
          type: string
        email:
          type: string
        entity_id:
          type: integer
        can_concur:
          type: boolean
          description: Whether the user can submit concurrences
        entity:
          $ref: '#/components/schemas/Entity'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        closedInquiries:
          type: array
          items:
            $ref: '#/components/schemas/Inquiry'
    UserResponse:
      type: object
      required:
        - id
        - external_id
        - name
        - email
        - entity_id
        - can_concur
        - entity
      properties:
        id:
          type: integer
        external_id:
          type: string
        name:
          type: string
        email:
          type: string
        entity_id:
          type: integer
        can_concur:
          type: boolean
          description: Whether the user can submit concurrences
        entity:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            abbreviation:
              type: string
            type:
              $ref: '#/components/schemas/UserType'
    Entity:
      type: object
      required:
        - abbreviation
        - name
        - type
        - active
        - inquiriesAsEntityA
        - inquiriesAsEntityB
      properties:
        id:
          type: integer
        abbreviation:
          type: string
        name:
          type: string
        type:
